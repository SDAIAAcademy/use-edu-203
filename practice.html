<section>
<h2>الجلسة 1: الأطر، وكيف يتعلم الذكاء الاصطناعي</h2>
<ol>
<li><p>أربع معلمات في مجمّع مدارس السَّنا كتبن هدفًا عن الذكاء الاصطناعي في دروسهن. أي درس يعلّم الطالبات شيئًا عن الذكاء الاصطناعي نفسه؟</p><ul><li><b>أ.</b> الطالبات يطلبن من مساعد أن يصمم عرضًا عن دورة الماء</li><li><b>ب.</b> الطالبات يتحققن من خمس إجابات مطبوعة لمساعد عن دورة الماء بالكتاب</li><li><b>ج.</b> الطالبات يشاهدن مقطعًا عن مستقبل الذكاء الاصطناعي في الطب</li><li><b>د.</b> الطالبات يستخدمن مساعدًا ليلخّص لهن درس دورة الماء</li></ul></li>
<li><p>مجموعة في الصف الثاني كتبت قاعدة تصيب في بطاقات التدريب الاثنتي عشرة كلها. ماذا تقول معلمتهن؟</p><ul><li><b>أ.</b> «أحسنتن، وجدتن القاعدة الصحيحة»</li><li><b>ب.</b> «نحتاج إلى بطاقات تدريب أكثر من النوع نفسه»</li><li><b>ج.</b> «القاعدة الصحيحة هي كذا، اكتبنها»</li><li><b>د.</b> «لا نعرف بعد. لنختبرها ببطاقات لم نرها»</li></ul></li>
<li><p>مصنِّف أصاب في كل صور الاختبار الأول، ثم أخطأ في أغلب صور اختبار ثانٍ فيه اللافتات نفسها على خلفيات أخرى. ما التفسير الأرجح؟</p><ul><li><b>أ.</b> في صور التدريب كان لكل صنف خلفيته، فتعلّم الخلفية</li><li><b>ب.</b> في الأداة عطل، ويجب إعادة تشغيلها</li><li><b>ج.</b> صور التدريب قليلة، ونحتاج إلى مئات من النوع نفسه</li><li><b>د.</b> المصنِّف نسي ما تعلّمه بعد الاختبار الأول</li></ul></li>
<li><p>معلمة الرياضيات في الصف الأول المتوسط تخطط درسًا عن المتوسط الحسابي. تعرض على الشاشة ثلاث إجابات مطبوعة لمساعد عن مسألة واحدة، وتطلب من الطالبات أن يجدن الإجابة الخاطئة ويثبتن خطأها بالحساب. بأي كفاية من الإطار الوطني يرتبط هذا النشاط؟</p><ul><li><b>أ.</b> D2.3 تعلم الآلة وأداء النماذج</li><li><b>ب.</b> D3.2 التحقق من النتائج والمخرجات</li><li><b>ج.</b> D3.1 صياغة أوامر واضحة وتحسينها</li><li><b>د.</b> D4.2 حماية البيانات الشخصية</li></ul></li>
<li><p>في خريطة زميلتك أربعة دروس كُتب أمام كل منها «إلمام». أي درس منها تطلب منها أن تراجع حكمها عليه؟</p><ul><li><b>أ.</b> طالبات الثالث الابتدائي يفرزن أزرارًا بحسب صفة ويسمّينها، ثم يختبرن قاعدتهن بأزرار جديدة</li><li><b>ب.</b> طالبات السادس يقارنّ خمس ترجمات آلية لجملة واحدة ويجدن الخطأ المتكرر</li><li><b>ج.</b> طالبات الثاني المتوسط يطلبن من مساعد أن يكتب لهن خاتمة لموضوع التعبير</li><li><b>د.</b> طالبات الأول الثانوي يصنّفن أخطاء مساعد في عشر إجابات عن درس الجغرافيا</li></ul></li>
<li><p>مديرة مدرسة تسأل: «أي إطار يقول ما يحتاج المعلم نفسه أن يعرفه ويفعله، لا ما يتعلمه الطالب؟». بماذا تجيبها؟</p><ul><li><b>أ.</b> إطار AILit لمنظمة التعاون الاقتصادي والتنمية والمفوضية الأوروبية</li><li><b>ب.</b> إطار كفايات البيانات والذكاء الاصطناعي للتعليم العام</li><li><b>ج.</b> إطار اليونسكو لكفاءات الطلاب</li><li><b>د.</b> إطار اليونسكو لكفاءات المعلمين</li></ul></li>
<li><p>في لعبة تصنيف دون حاسوب للصف الثاني، كل الفواكه «الحلوة» في بطاقات التدريب صفراء، وكل «الحامضة» خضراء. كتبت المجموعة: «الأصفر حلو». ما البطاقة التي تضعها المعلمة في الاختبار لتكشف ضعف القاعدة؟</p><ul><li><b>أ.</b> موزة صفراء حلوة</li><li><b>ب.</b> ليمونة صفراء حامضة</li><li><b>ج.</b> تفاحة خضراء حامضة</li><li><b>د.</b> موزة صفراء أكبر حجمًا</li></ul></li>
<li><p>طالبات الخامس درّبن مصنِّفًا يفرّق بين «قلم» و«ممحاة». صوّرن الأقلام كلها على الطاولة البيضاء والمماحي كلها على الدفتر الأزرق. في الاختبار وضعن ممحاة على الطاولة البيضاء فقال «قلم». ما أول ما تطلبه المعلمة؟</p><ul><li><b>أ.</b> أن يُعدن تشغيل الأداة ويجرّبن مرة أخرى</li><li><b>ب.</b> أن يضفن خمسين صورة أخرى للأقلام على الطاولة</li><li><b>ج.</b> أن ينظرن في صور التدريب: ما الذي يتكرر مع كل صنف غير الشيء نفسه؟</li><li><b>د.</b> أن يكتبن في تقريرهن أن المصنِّف ضعيف في المماحي</li></ul></li>
</ol>
</section>
<section>
<h2>الجلسة 2: التحقق، ثم درس في مادتك</h2>
<ol>
<li><p>طالبات الصف الخامس درّبن مصنِّفًا يفرّق بين أوراق شجرتين، واختبرنه بعشر صور التقطنها في اليوم نفسه وفي المكان نفسه، فأصاب في العشر. ما الذي تطلبه المعلمة قبل أن يكتبن «المصنِّف دقيق»؟</p><ul><li><b>أ.</b> عشر صور أخرى من المكان نفسه</li><li><b>ب.</b> تدريبًا أطول على الصور نفسها</li><li><b>ج.</b> صورًا في مكان آخر وضوء آخر</li><li><b>د.</b> نسبة الثقة التي تعرضها الأداة</li></ul></li>
<li><p>طالبة في الثاني المتوسط تتحقق من إجابة مطبوعة تستشهد بكتاب وصفحة. بحثت في فهرس المكتبة فلم تجد الكتاب. ماذا تكتب في ورقة التحقق؟</p><ul><li><b>أ.</b> معيبة، مصدر مختلق، والدليل: لا نتيجة في الفهرس</li><li><b>ب.</b> سليمة، لأن الإجابة ذكرت مصدرها بدقة</li><li><b>ج.</b> لا حكم، حتى نسأل المساعد عن المصدر</li><li><b>د.</b> معيبة، معلومة قديمة، لأن الكتاب قديم</li></ul></li>
<li><p>طالبات الأول الثانوي يتداولن لقطة شاشة لإجابة روبوت محادثة: «قررت وزارة التعليم إلغاء الاختبارات النهائية هذا العام». يسألن معلمتهن: هل هذا صحيح؟ بماذا تبدأ؟</p><ul><li><b>أ.</b> تفحص اللقطة: هل هي معدّلة أم أصلية؟</li><li><b>ب.</b> تسأل الروبوت نفسه: ما مصدرك؟</li><li><b>ج.</b> تسأل: كم طالبة وصلتها اللقطة؟</li><li><b>د.</b> تبحث مع الطالبات عن القرار في قنوات الوزارة الرسمية</li></ul></li>
<li><p>معلمة اللغة العربية للثاني المتوسط تعرض على الشاشة ثلاث إجابات مطبوعة لمساعد عن إعراب جملة، وكل طالبة تجد الإجابة الخاطئة وتصحّحها وتكتب القاعدة. أي فئة استخدام تكتبها المعلمة لمهمة الطالبة؟</p><ul><li><b>أ.</b> AI-3، لأن في الدرس محتوى مولَّدًا</li><li><b>ب.</b> AI-0، لأن الطالبة تتحقق من مخرج جاهز بنفسها</li><li><b>ج.</b> AI-4، لأن الدرس عن الذكاء الاصطناعي</li><li><b>د.</b> AI-2، لأن فيه تصحيحًا وتغذية راجعة</li></ul></li>
<li><p>في نشاط التحقق للأول الثانوي أجاب المساعد عن سؤال في التاريخ بفقرة سلسة فيها اسم كتاب ومؤلف ورقم صفحة. طالبة تقول: «فيه مصدر، إذن هو صحيح». ما الخطوة التي تطلبها منها المعلمة؟</p><ul><li><b>أ.</b> أن تسأل المساعد: «هل أنت متأكد؟»</li><li><b>ب.</b> أن تبحث عن الكتاب في فهرس المكتبة</li><li><b>ج.</b> أن تسأل مساعدًا آخر السؤال نفسه</li><li><b>د.</b> أن تنسخ المصدر في بحثها كما ورد</li></ul></li>
<li><p>معلمة عرضت عشرين صورة ولّدها أمر «صورة لعالِم في مختبر». تسع عشرة منها تُظهر رجلًا. ما السؤال الذي تبدأ به نقاش الطالبات؟</p><ul><li><b>أ.</b> «أي الصور أجمل؟»</li><li><b>ب.</b> «هل الصور حقيقية أم مولّدة؟»</li><li><b>ج.</b> «من يظهر في أغلب الصور، ومن يغيب، ومن أين جاء ذلك؟»</li><li><b>د.</b> «كيف نكتب أمرًا يعطي صورًا أدق؟»</li></ul></li>
<li><p>أربع معلمات كتبن هدف الإلمام بالذكاء الاصطناعي في خططهن. أي هدف تقبله المراجِعة كما هو؟</p><ul><li><b>أ.</b> تصنّف الطالبة خطأين في إجابات مساعد وتكتب دليل كل منهما</li><li><b>ب.</b> تفهم الطالبة كيف يعمل الذكاء الاصطناعي</li><li><b>ج.</b> تستخدم الطالبة المساعد لتلخيص الدرس</li><li><b>د.</b> تعرف الطالبة أهمية الذكاء الاصطناعي في المستقبل</li></ul></li>
<li><p>درس علوم للصف الخامس: الطالبات يدرّبن مصنِّفًا على جهاز المعلمة ثم يختبرنه. هدف الإلمام: «تختبر الطالبة مصنِّفًا وتصف حدًّا له». أي اختبار فهم دون ذكاء اصطناعي يقيس هذا الهدف؟</p><ul><li><b>أ.</b> ورقة فيها قاعدة وست صور جديدة، تكتب الطالبة أين ستخطئ القاعدة ولماذا</li><li><b>ب.</b> سؤال: «عرّفي المصنِّف في سطر»</li><li><b>ج.</b> أن تدرّب كل طالبة مصنِّفًا جديدًا في المنزل</li><li><b>د.</b> أن تسأل الطالبة المساعد عن حدود المصنِّفات وتكتب ما قاله</li></ul></li>
<li><p>خطة درس للصف الثاني الابتدائي (من 6 إلى 8 سنوات) فيها: «تسأل كل طالبة روبوت المحادثة وتنسخ إجابته، وتُقيَّم على ما نسخته». بماذا تنصح المراجِعة؟</p><ul><li><b>أ.</b> أن تبقى الخطة وتُضاف جملة إفصاح في آخر الورقة</li><li><b>ب.</b> أن تعرض المعلمة هي إجابة جاهزة، وأن يبقى ما يُقيَّم من عمل الطالبة دون ذكاء اصطناعي</li><li><b>ج.</b> أن تستخدم الطالبات الأداة في مجموعات لا فرادى</li><li><b>د.</b> أن تُنقل المهمة إلى الواجب المنزلي بإشراف الأسرة</li></ul></li>
</ol>
</section>
<section>
<h2>الجلسة 3: حماية الطلاب، والأسر، والدرس التجريبي</h2>
<ol>
<li><p>هدف الإلمام في درس اجتماعيات للأول الثانوي: «تتحقق الطالبة من إجابة مساعد بمصدر وتكتب دليلها». أي اختبار فهم دون ذكاء اصطناعي تختاره المعلمة لآخر الدرس؟</p><ul><li><b>أ.</b> «عدّدي أنواع الخطأ الخمسة»</li><li><b>ب.</b> إجابة مطبوعة جديدة وصفحة من الأطلس، تحكم الطالبة وتكتب دليلها</li><li><b>ج.</b> «اسألي المساعد سؤالًا وأحضري إجابته»</li><li><b>د.</b> «اكتبي فقرة عن أهمية التحقق»</li></ul></li>
<li><p>معلمة في مجمّع السَّنا تريد أن يساعدها «يَراع»، وهو معتمد للمعلمات، في كتابة ملاحظات نهاية الفصل لثلاثين طالبة. ما الطريق الذي يوافق قواعد المجمّع؟</p><ul><li><b>أ.</b> تلصق جدول الأسماء والدرجات، فالأداة معتمدة</li><li><b>ب.</b> تحذف الأسماء وتبقي رقم المقعد والدرجة والملاحظة</li><li><b>ج.</b> تستخدم أداة أخرى مشهورة تَعِد بعدم حفظ المحادثات</li><li><b>د.</b> تطلب صيغًا عامة لمستويات الأداء، وتكتب ملاحظة كل طالبة بنفسها</li></ul></li>
<li><p>درسك: طالبات الثاني المتوسط يتحققن في الحصة من إجابات مطبوعة لمساعد، والواجب ورقة تُحل من الكتاب. أي جملة تبقيها في رسالتك إلى الأسر كما هي؟</p><ul><li><b>أ.</b> «لن تفتح ابنتكم أي حساب، والواجب ورقة تُحل من الكتاب»</li><li><b>ب.</b> «سيرفع هذا الدرس درجات ابنتكم في كل المواد»</li><li><b>ج.</b> «سننمّي كفاية التحقق من مخرجات النماذج التوليدية»</li><li><b>د.</b> «المساعد مصدر موثوق تراجع به ابنتكم دروسها»</li></ul></li>
<li><p>أربع معلمات كتبن ملاحظة عن لحظة الخطأ في دروسهن. أي ملاحظة تُسلَّم في المجلد كما هي؟</p><ul><li><b>أ.</b> «سارة أول من لاحظت أن القاعدة أخطأت»</li><li><b>ب.</b> «الطالبة التي تجلس في الأمام وعندها ضعف سمع لم تشارك»</li><li><b>ج.</b> «قالت طالبة: كل الحمراء كان لها ذيل! ثم وافقتها مجموعتان»</li><li><b>د.</b> صورة للمجموعة الفائزة وهي ترفع بطاقاتها</li></ul></li>
<li><p>معلمة تريد من مساعدها المعتمد أن يقترح خطة علاجية لطالبة. حذفت اسمها وكتبت: «طالبة في الصف الرابع ب، والدها متوفى حديثًا، ودرجتها في القراءة 4 من 10». ما القرار؟</p><ul><li><b>أ.</b> مسموح، لأن الاسم محذوف</li><li><b>ب.</b> مسموح، لأن المساعد معتمد للمعلمات</li><li><b>ج.</b> ممنوع: ما كُتب يدل على الطالبة وفيه حالتها الأسرية ودرجتها</li><li><b>د.</b> مسموح إن وافقت الطالبة</li></ul></li>
<li><p>طالبة في الثاني المتوسط تخبر معلمتها أن زميلات يتداولن مقطعًا بصوت مولَّد يقلّد صوت معلمة أخرى وهي «تقول» كلامًا مسيئًا. ما أول ما تفعله المعلمة؟</p><ul><li><b>أ.</b> تطلب المقطع وتحلله لتتأكد من أنه مولَّد</li><li><b>ب.</b> تسأل الطالبات في الحصة عمّن صنع المقطع</li><li><b>ج.</b> تبلّغ المسؤول عن الحماية في المدرسة في اليوم نفسه ولا تعيد إرسال المقطع</li><li><b>د.</b> تنتظر لترى هل ينتشر المقطع قبل أن تتصرف</li></ul></li>
<li><p>معلمة الصف الثالث الابتدائي وجدت أداة محادثة مجانية مشهورة، وتريد أن تسألها كل طالبة سؤالًا واحدًا من الجهاز اللوحي تحت نظرها. الأداة ليست في سجل مدرستها. ما القرار؟</p><ul><li><b>أ.</b> ممنوع: الأداة غير معتمدة، وهذه الفئة العمرية لا تستخدم الأدوات استخدامًا مستقلًّا</li><li><b>ب.</b> مسموح، لأن المعلمة حاضرة وتراقب</li><li><b>ج.</b> مسموح، لأن الأداة مجانية ومشهورة</li><li><b>د.</b> مسموح إن لم تكتب الطالبات أسماءهن</li></ul></li>
<li><p>أربع جمل من مسودات رسائل إلى الأسر عن درس يتحقق فيه الطلاب من إجابات مساعد مطبوعة. أي جملة تبقى في الرسالة كما هي؟</p><ul><li><b>أ.</b> «سنوظف النماذج اللغوية التوليدية لتنمية مهارات التفكير الناقد»</li><li><b>ب.</b> «الأداة آمنة تمامًا ولا خطر منها»</li><li><b>ج.</b> «لن يفتح الطلاب أي حساب، وسيقرؤون إجابات مطبوعة ويبحثون عن أخطائها»</li><li><b>د.</b> «يُفضَّل أن يتدرب الطالب في المنزل على روبوت محادثة قبل الدرس»</li></ul></li>
<li><p>معلمة تكتب واجبًا لدرسها عن التحقق، ونصف أسر صفها بلا حاسوب في المنزل. أي صياغة للواجب تضعها في الرسالة إلى الأسر؟</p><ul><li><b>أ.</b> «يسأل الطالب أي مساعد سؤالين ويحضر الإجابتين»</li><li><b>ب.</b> «ورقة فيها ثلاث إجابات مطبوعة، يتحقق منها الطالب من كتابه»</li><li><b>ج.</b> «من يملك حاسوبًا يستخدم المساعد، والباقون معفون من الواجب»</li><li><b>د.</b> «يستعين الطالب بهاتف أحد والديه لفتح المساعد»</li></ul></li>
<li><p>صاغ مساعدك المعتمد رسالة جيدة الأسلوب إلى الأسر، وفيها: «وسيصحح المساعد أعمال الطلاب». خطة درسك لا تذكر ذلك. ماذا تفعل قبل الإرسال؟</p><ul><li><b>أ.</b> تقابل كل سطر بالخطة وقواعد المدرسة، وتحذف ما لا أصل له</li><li><b>ب.</b> ترسلها، فالأسلوب واضح والخطأ صغير</li><li><b>ج.</b> تضيف في آخرها أن المساعد هو من كتبها</li><li><b>د.</b> تطلب من المساعد أن يراجع الرسالة بنفسه</li></ul></li>
</ol>

 سيفعل ابنها","يَعِد بما لا يملكه: الدرس نفسه عن أن هذه الأدوات تخطئ","","يفترض أداة وحسابًا في كل بيت، ويخالف أن الطلاب لا يفتحون حسابات"],"lo":["LO5"],"day":3,"session":2,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-letter-02","type":"single","prompt":"معلمة تكتب واجبًا لدرسها عن التحقق، ونصف أسر صفها بلا حاسوب في المنزل. أي صياغة للواجب تضعها في الرسالة إلى الأسر؟","options":[{"key":"أ","text":"«يسأل الطالب أي مساعد سؤالين ويحضر الإجابتين»"},{"key":"ب","text":"«ورقة فيها ثلاث إجابات مطبوعة، يتحقق منها الطالب من كتابه»"},{"key":"ج","text":"«من يملك حاسوبًا يستخدم المساعد، والباقون معفون من الواجب»"},{"key":"د","text":"«يستعين الطالب بهاتف أحد والديه لفتح المساعد»"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"الواجب له مسار كامل دون أداة ودون إنترنت، والمسار نفسه للجميع. هذا ما تقوله الرسالة للأسر.","misconceptions":["يشترط أداة في المنزل: من لا يملكها لا يستطيع أداء الواجب","","يحل التفاوت بالإعفاء: فريق يتعلم وفريق لا يتعلم","ينقل شرط الأداة إلى الوالدين، ويفتح للطفل حسابًا ليس له"],"lo":["LO5"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-letter-03","type":"single","prompt":"صاغ مساعدك المعتمد رسالة جيدة الأسلوب إلى الأسر، وفيها: «وسيصحح المساعد أعمال الطلاب». خطة درسك لا تذكر ذلك. ماذا تفعل قبل الإرسال؟","options":[{"key":"أ","text":"تقابل كل سطر بالخطة وقواعد المدرسة، وتحذف ما لا أصل له"},{"key":"ب","text":"ترسلها، فالأسلوب واضح والخطأ صغير"},{"key":"ج","text":"تضيف في آخرها أن المساعد هو من كتبها"},{"key":"د","text":"تطلب من المساعد أن يراجع الرسالة بنفسه"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"في الرسالة يُسمح بالذكاء الاصطناعي كاملًا، والمعلم يتحقق منها ويتحمل مسؤوليتها: كل سطر يقابله سطر في الخطة أو القواعد.","misconceptions":["","يقيس الرسالة بأسلوبها: جملة غير صحيحة عن التصحيح تمس ثقة الأسرة","يظن أن الإفصاح ينقل المسؤولية: من يرسل هو المسؤول عن كل سطر","يجعل المساعد حكمًا على ما كتبه: هو لا يعرف خطتك ولا قواعد مدرستك"],"lo":["LO5"],"day":3,"ses
